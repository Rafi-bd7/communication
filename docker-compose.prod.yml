version: '3.8'

services:
  # 1. High-Performance PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: adda-postgres
    environment:
      POSTGRES_DB: adda_db
      POSTGRES_USER: adda_user
      POSTGRES_PASSWORD: adda_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adda_user -d adda_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & PubSub for Real-Time Scaling
  redis:
    image: redis:7-alpine
    container_name: adda-redis
    restart: always
    volumes:
      - redis_data:/data

  # 3. FastAPI Real-Time Asynchronous Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adda-backend
    environment:
      - SECRET_KEY=adda-super-production-secret-key-replace-with-openssl-rand
      - DATABASE_URL=postgresql+asyncpg://adda_user:adda_secure_password_2026@postgres:5432/adda_db
      - ENVIRONMENT=production
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # 4. Next.js 14 Web Frontend (PWA)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: adda-web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
    depends_on:
      - backend
    restart: always

  # 5. Nginx High-Concurrency Reverse Proxy (SSL & WebSockets)
  nginx:
    image: nginx:alpine
    container_name: adda-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_uploads:/var/www/uploads:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - web
    restart: always

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
