services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: adda-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adda-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  - type: web
    name: adda-frontend
    runtime: node
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: BACKEND_URL
        fromService:
          name: adda-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          name: adda-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

# ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: adda-db
    databaseName: adda
    user: adda_user
    plan: free
