services:
  # ── Backend (FastAPI - 100% Free Plan) ────────────────────────────────────
  - type: web
    name: adda-backend
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
