services:
  # ── Backend (FastAPI Web Service) ────────────────────────────────────
  - type: web
    name: adda-backend
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: adda-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.8

databases:
  # ── Persistent PostgreSQL Database ────────────────────────────────────
  - name: adda-db
    plan: free
    databaseName: adda
    user: adda_user
