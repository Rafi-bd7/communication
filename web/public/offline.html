<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — AntiChat</title>
  <style>
    body {
      background-color: #0b141a;
      color: #e9edef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #8696a0;
      font-size: 15px;
      max-width: 400px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    button {
      background-color: #00a884;
      color: #111b21;
      font-weight: 600;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 15px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #029070;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You are currently offline</h1>
  <p>AntiChat requires an internet connection to sync live messages, video calls, and stories. Please check your connection and retry.</p>
  <button onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
